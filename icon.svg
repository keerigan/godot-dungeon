<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#2b1f52"/>
      <stop offset="55%" stop-color="#150f2c"/>
      <stop offset="100%" stop-color="#090713"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#33e6ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4fe9ff" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9fbff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#4fd8ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3aa8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#8af3ff"/>
      <stop offset="100%" stop-color="#25c6ea"/>
    </radialGradient>
    <radialGradient id="portal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7bff9e" stop-opacity="0"/>
      <stop offset="70%" stop-color="#57ffb0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#57ffb0" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="danger" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8fbf"/>
      <stop offset="55%" stop-color="#ff2f8a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2f8a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fond sombre arrondi -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- bordure néon subtile -->
  <rect x="3" y="3" width="122" height="122" rx="25.5" fill="none"
        stroke="#6a5cff" stroke-opacity="0.55" stroke-width="2"/>

  <!-- trame de donjon très discrète -->
  <g stroke="#8a7bff" stroke-opacity="0.07" stroke-width="2">
    <line x1="14" y1="52" x2="114" y2="52"/>
    <line x1="14" y1="84" x2="114" y2="84"/>
    <line x1="46" y1="14" x2="46" y2="114"/>
    <line x1="82" y1="14" x2="82" y2="114"/>
  </g>

  <!-- portail de sortie (anneau néon en haut à droite) -->
  <g transform="translate(99,33)">
    <circle r="13" fill="url(#portal)"/>
    <circle r="12.5" fill="none" stroke="#5effb2" stroke-opacity="0.85" stroke-width="2.4"/>
  </g>

  <!-- points de danger -->
  <circle cx="33" cy="99" r="9" fill="url(#danger)"/>
  <circle cx="33" cy="99" r="3.2" fill="#ffd7e8"/>
  <circle cx="104" cy="96" r="8" fill="url(#danger)"/>
  <circle cx="104" cy="96" r="2.8" fill="#ffd7e8"/>

  <!-- traînée de vitesse (cône) -->
  <path d="M16 64 L60 49 L60 79 Z" fill="url(#trail)" opacity="0.55"/>
  <g stroke-linecap="round">
    <line x1="22" y1="54" x2="52" y2="54" stroke="#5fe9ff" stroke-opacity="0.35" stroke-width="3"/>
    <line x1="18" y1="64" x2="54" y2="64" stroke="#5fe9ff" stroke-opacity="0.5" stroke-width="3.5"/>
    <line x1="22" y1="74" x2="52" y2="74" stroke="#5fe9ff" stroke-opacity="0.35" stroke-width="3"/>
  </g>

  <!-- héros-lueur -->
  <circle cx="74" cy="64" r="30" fill="url(#glow)"/>
  <circle cx="74" cy="64" r="15" fill="url(#core)"/>
  <circle cx="68.5" cy="58.5" r="4.5" fill="#ffffff" fill-opacity="0.85"/>
</svg>
